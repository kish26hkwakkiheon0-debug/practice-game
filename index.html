<!DOCTYPE html>

<title>숫자 탭 게임</title>


<style>

/* ══════════════════════════════
   기본
══════════════════════════════ */

*, *::before, *::after {

  box-sizing: border-box;

  margin: 0;

  padding: 0;

  -webkit-tap-highlight-color: transparent;

}


:root {

  --bg: #ffffff;

  --bg2: #f5f5f3;

  --bg3: #e8e8e5;

  --text: #1a1a1a;

  --text2: #666660;

  --border: rgba(0,0,0,0.13);

  --border2: rgba(0,0,0,0.22);

  --info: #185fa5;

  --danger: #e24b4a;


  --correct-bg: #d9f5d0;

  --correct-border: #3b8f32;

  --correct-text: #24651f;


  --wrong-bg: #ffe0df;

  --wrong-border: #e24b4a;

  --wrong-text: #b42323;


  --bonus-bg: #fff1c7;

  --bonus-border: #d89b20;

  --bonus-text: #9a6500;


  --radius: 12px;

  --radius-sm: 8px;

}


@media (prefers-color-scheme: dark) {

  :root {

    --bg: #1c1c1e;

    --bg2: #2c2c2e;

    --bg3: #3a3a3c;

    --text: #f2f2f7;

    --text2: #8e8e93;

    --border: rgba(255,255,255,0.1);

    --border2: rgba(255,255,255,0.2);

    --info: #64a8f0;

    --danger: #ff6b6b;


    --correct-bg: #1f4d24;

    --correct-border: #65b85c;

    --correct-text: #a9e5a2;


    --wrong-bg: #5a2020;

    --wrong-border: #ff6b6b;

    --wrong-text: #ffb0b0;


    --bonus-bg: #5a4618;

    --bonus-border: #d8a62b;

    --bonus-text: #ffd66b;

  }

}


body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    sans-serif;

  background: var(--bg);

  color: var(--text);

  min-height: 100vh;

  overscroll-behavior: none;

}


#app {

  max-width: 420px;

  margin: 0 auto;

  padding:
    1.5rem
    1rem
    3rem;

}


/* ══════════════════════════════
   기본 버튼
══════════════════════════════ */

.btn-primary {

  display: block;

  width: 100%;

  padding: 14px;

  font-size: 16px;

  font-weight: 600;

  border-radius: var(--radius-sm);

  border: none;

  background: var(--text);

  color: var(--bg);

  cursor: pointer;

  touch-action: manipulation;

}


.btn-primary:active {

  opacity: 0.75;

  transform: scale(0.98);

}


.btn-secondary {

  display: block;

  width: 100%;

  padding: 13px;

  font-size: 15px;

  font-weight: 500;

  border-radius: var(--radius-sm);

  border:
    0.5px solid var(--border2);

  background: var(--bg);

  color: var(--text);

  cursor: pointer;

  touch-action: manipulation;

}


.btn-secondary:active {

  background: var(--bg3);

}


/* ══════════════════════════════
   닉네임 화면
══════════════════════════════ */

#screen-nick {

  display: flex;

  flex-direction: column;

  align-items: center;

  padding-top: 3.5rem;

}


.game-title {

  font-size: 28px;

  font-weight: 700;

  margin-bottom: 6px;

  text-align: center;

}


.game-sub {

  font-size: 14px;

  margin-bottom: 2.5rem;

  text-align: center;

  line-height: 1.6;

}


#nick-input {

  width: 100%;

  max-width: 300px;

  font-size: 17px;

  padding: 12px 14px;

  margin-bottom: 14px;

  border-radius: var(--radius-sm);

  border:
    0.5px solid var(--border2);

  background: var(--bg);

  color: var(--text);

  outline: none;

  -webkit-appearance: none;

}


#nick-input:focus {

  border-color: var(--info);

  box-shadow:

}


#nick-ok {

}


/* ══════════════════════════════
   게임 화면
══════════════════════════════ */

#screen-game {

  display: none;

}


#header {

  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 1rem;

}


#nick-badge {

#timer-wrap {

}


#timer {

}


#timer.urgent {

}

/* ══════════════════════════════
   점수
══════════════════════════════ */

#score-wrap {

  display: flex;

  align-items: center;

  justify-content: space-between;

  border-radius: var(--radius-sm);

  margin-bottom: 1rem;

}


#score-wrap .s-label {

  color: var(--text2);

}


#score-wrap .s-val {

}


#next-hint {

  text-align: right;

}


#next-hint span {

/* ══════════════════════════════
   보너스 상태
══════════════════════════════ */

#bonus-status {

  display: none;

  text-align: center;

  font-size: 14px;

  font-weight: 700;

  border:

  border-radius: var(--radius-sm);

  padding: 8px;

  margin-bottom: 10px;

}


#bonus-status.show {

  display: block;

}


/* ══════════════════════════════
   카운트다운
══════════════════════════════ */

#countdown {

  height: 72px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 58px;

  font-weight: 700;

}


/* ══════════════════════════════
   숫자 그리드
══════════════════════════════ */

#grid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-bottom: 10px;

}


.card {

  aspect-ratio: 1;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 28px;

  font-weight: 700;

  border-radius: var(--radius);

  border:
    0.5px solid var(--border2);

  background: var(--bg);

  color: var(--text);

  user-select: none;

  -webkit-user-select: none;

  touch-action: manipulation;

  cursor: pointer;

  transition:
    transform 0.08s,
    background 0.1s,
    border-color 0.1s,
    color 0.1s;

}


.card:active {

  transform: scale(0.91);

}


/* ══════════════════════════════
   정답 효과
══════════════════════════════ */

.card.correct {

  background: var(--correct-bg);

  border-color: var(--correct-border);

  color: var(--correct-text);

  transform: scale(0.93);

}


/* ══════════════════════════════
   오답 효과
══════════════════════════════ */

.card.wrong {

  background: var(--wrong-bg);

  border-color: var(--wrong-border);

  color: var(--wrong-text);

  animation: shake 0.35s;

}


@keyframes shake {

  0%,100% {

    transform:
      translateX(0);

  }

  20% {

    transform:
      translateX(-8px);

  }

  40% {

    transform:
      translateX(8px);

  }

  60% {

    transform:
      translateX(-5px);

  }

  80% {

    transform:
      translateX(5px);

  }

}


/* ══════════════════════════════
   빈 카드
══════════════════════════════ */

.card.empty {

  visibility: hidden;

  pointer-events: none;

}


/* ══════════════════════════════
   보너스 카드
══════════════════════════════ */

.card.bonus {

  background: var(--bonus-bg);

  border:
    2px solid var(--bonus-border);

  color: var(--bonus-text);

  font-size: 18px;

  cursor: pointer;

}


.card.bonus:active {

  transform:
    scale(0.91);

}


.card.bonus.hit {

  animation:
    bonusPop 0.12s ease;

}


@keyframes bonusPop {

  0% {

    transform:
      scale(1);

  }

  50% {

    transform:
      scale(0.88);

  }

  100% {

    transform:
      scale(1);

  }

}

══════════════════════════════ */

<script type="module">

import {
  initializeApp
}
from

import {
  getDatabase,
  ref,
  push,
  get
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDVrf8vbtBHJYD93EhXosITNmgym80GOMw",

  authDomain:
    "numberupgame.firebaseapp.com",

  databaseURL:
    "https://numberupgame-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "numberupgame",

  storageBucket:
    "numberupgame.firebasestorage.app",

  messagingSenderId:
    "209419310847",

  appId:
    "1:209419310847:web:916c8f6fc0a730b8191eca"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);



window.fbSave =
async (name, score) => {

  await push(

    ref(
      db,
      'scores'
    ),

    {

      name,

      score,

      t:
        Date.now()

    }

  );

};



window.fbLoadTop10 =
async () => {

  const snap =
    await get(
      ref(
        db,
        'scores'
      )
    );


  if (
    !snap.exists()
  ) {

    return [];

  }


  const rows =
    Object.values(
      snap.val()
    );


  const best = {};


  rows.forEach(
    r => {

      if (
        !best[r.name] ||
        r.score >
        best[r.name].score
      ) {

        best[r.name] = r;

      }

    }
  );


  return Object.values(best)

    .sort(
      (a,b) =>
        b.score - a.score
    )

    .slice(
      0,
      10
    );

};

<script>

/* ══════════════════════════════

let round = 1;

let timeLeft = 60;

let gameActive = false;


let countdownRunning = false;


/* ══════════════════════════════

══════════════════════════════ */

let bonusActive = false;


let bonusTimerInt = null;


let bonusTimeLeft = 10;


/*
   보너스 종료 후
   복귀할 숫자판
*/

let bonusReturnNumbers = null;


/* ══════════════════════════════
   효과음 관련
══════════════════════════════ */

let audioCtx = null;


let sound30Played = false;


let sound10Played = false;


/* ══════════════════════════════
   오디오 초기화
══════════════════════════════ */

function initAudio() {

  if (!audioCtx) {

    audioCtx =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  if (
    audioCtx.state ===
    'suspended'
  ) {

    audioCtx.resume();

  }

}


/* ══════════════════════════════
   기본 음 생성
══════════════════════════════ */

function tone(
  frequency,
  duration,
  type = 'sine',
  volume = 0.08,
  delayTime = 0
) {

  initAudio();


  const osc =
    audioCtx.createOscillator();


  const gain =
    audioCtx.createGain();


  const start =
    audioCtx.currentTime +
    delayTime;


  osc.type =
    type;


  osc.frequency.setValueAtTime(
    frequency,
    start
  );


  gain.gain.setValueAtTime(
    0.0001,
    start
  );


  gain.gain.exponentialRampToValueAtTime(
    volume,
    start + 0.01
  );


  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration
  );


  osc.connect(gain);

  gain.connect(
    audioCtx.destination
  );


  osc.start(start);

  osc.stop(
    start +
    duration +
    0.02
  );

}

/* ══════════════════════════════
   딜레이
══════════════════════════════ */

function delay(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}

/* ══════════════════════════════
   숫자 배열
══════════════════════════════ */

function makeNumbers(start) {

  const numbers = [];


  for (
    let i = 0;
    i < 9;
    i++
  ) {

    numbers.push(
      start + i
    );

  }


  return shuffle(numbers);

}


/* ══════════════════════════════
   셔플
══════════════════════════════ */

function shuffle(array) {

  const arr =
    [...array];


  for (
    let i =
      arr.length - 1;

    i > 0;

    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }


  return arr;

}


/* ══════════════════════════════
   숫자판 생성
══════════════════════════════ */

function buildGrid() {

  const grid =
    $('grid');


  grid.innerHTML =
    '';


  cells = [];


  const nums =
    makeNumbers(
      nextExp
    );


  nums.forEach(
    (n, idx) => {

      const d =
        document.createElement(
          'div'
        );


      d.className =
        'card active';


      d.textContent =
        n;


      d.addEventListener(
        'pointerup',
        e => {

          e.preventDefault();

          onCard(idx);

        }
      );


      grid.appendChild(d);


      cells.push({

        el: d,

        num: n

      });

    }
  );


  updateActiveCard();

}


/* ══════════════════════════════
   활성 숫자 표시
══════════════════════════════ */

function updateActiveCard() {

  if (
    bonusActive
  ) {

    return;

  }


  cells.forEach(
    cell => {

      cell.el
        .classList
        .remove(
          'active'
        );


      if (
        cell.num === null
      ) {

        cell.el
          .classList
          .add(
            'empty'
          );

        return;

      }


      cell.el
        .classList
        .remove(
          'empty'
        );


      if (
        cell.num ===
        nextExp
      ) {

        cell.el
          .classList
          .add(
            'active'
          );

      }

    }
  );


  $('next-num')
    .textContent =
      nextExp;

}


/* ══════════════════════════════
   한 판 완료
══════════════════════════════ */

function refillGrid() {

  round++;


  /*
    10% 확률로
    보너스 판
  */

  const isBonus =
    Math.random() <
    0.10;


  if (
    isBonus
  ) {

    startBonusRound();

    return;

  }


  /*
    일반 판
  */

  buildGrid();

}


/* ══════════════════════════════
   보너스 판 시작
══════════════════════════════ */

function startBonusRound() {

  bonusActive =
    true;


  /*
    보너스 등장 효과음
  */

  soundBonusStart();


  bonusTimeLeft =
    10;


  $('bonus-status')
    .classList
    .add(
      'show'
    );


  $('bonus-time')
    .textContent =
      bonusTimeLeft;


  $('next-hint')
    .style.visibility =
      'hidden';


  const grid =
    $('grid');


  grid.innerHTML =
    '';


  cells = [];


  /*
    BONUS 버튼 9개
  */

  for (
    let i = 0;
    i < 9;
    i++
  ) {

    const d =
      document.createElement(
        'div'
      );


    d.className =
      'card bonus';


    d.textContent =
      'BONUS';


    d.addEventListener(
      'pointerup',
      e => {

        e.preventDefault();

        onBonusCard(d);

      }
    );


    grid.appendChild(d);


    cells.push({

      el: d,

      num: null

    });

  }


  stopBonusTimer();


  bonusTimerInt =
    setInterval(
      () => {

        bonusTimeLeft--;


        $('bonus-time')
          .textContent =
            bonusTimeLeft;


        if (
          bonusTimeLeft <=
          0
        ) {

          endBonusRound();

        }

      },
      1000
    );

}


/* ══════════════════════════════
   보너스 버튼 클릭
══════════════════════════════ */

function onBonusCard(card) {

  if (
    !gameActive ||
    !bonusActive
  ) {

    return;

  }


  /*
    클릭할 때마다 +1
  */

  score++;


  $('score-disp')
    .textContent =
      score;


  soundBonusClick();


  /*
    버튼은 사라지지 않고
    클릭 애니메이션만 발생
  */

  card.classList.remove(
    'hit'
  );


  void card.offsetWidth;


  card.classList.add(
    'hit'
  );


  setTimeout(
    () => {

      card.classList.remove(
        'hit'
      );

    },
    120
  );

}


/* ══════════════════════════════
   보너스 종료
══════════════════════════════ */

function endBonusRound() {

  if (
    !bonusActive
  ) {

    return;

  }


  stopBonusTimer();


  bonusActive =
    false;


  $('bonus-status')
    .classList
    .remove(
      'show'
    );


  $('next-hint')
    .style.visibility =
      'visible';


  /*
    nextExp는 보너스 동안
    변하지 않았기 때문에

    원래 다음 숫자부터
    다시 시작한다.
  */

  buildGrid();

}


/* ══════════════════════════════
   보너스 타이머 정지
══════════════════════════════ */

function stopBonusTimer() {

  if (
    bonusTimerInt !==
    null
  ) {

    clearInterval(
      bonusTimerInt
    );


    bonusTimerInt =
      null;

  }

}


/* ══════════════════════════════
   일반 카드 클릭
══════════════════════════════ */

function onCard(idx) {

  if (
    !gameActive ||
    bonusActive
  ) {

    return;

  }


  const cell =
    cells[idx];


  if (
    !cell ||
    cell.num === null
  ) {

    return;

  }


  /* ══════════════════════
     오답
  ══════════════════════ */

  if (
    cell.num !==
    nextExp
  ) {

    soundWrong();


    cell.el
      .classList
      .remove(
        'wrong'
      );


    void cell.el.offsetWidth;


    cell.el
      .classList
      .add(
        'wrong'
      );


    setTimeout(
      () => {

        cell.el
          .classList
          .remove(
            'wrong'
          );

      },
      350
    );


    return;

  }


  /* ══════════════════════
     정답
  ══════════════════════ */

  soundCorrect();


  /*
    현재 라운드만큼 점수 증가

    1판 → +1
    2판 → +2
    3판 → +3
    ...
  */

  score += round;


  $('score-disp')
    .textContent =
      score;


  /*
    초록색 효과
  */

  cell.el
    .classList
    .add(
      'correct'
    );


  /*
    잠깐 초록색을 보여준 후
    버튼 제거
  */

  setTimeout(
    () => {

      if (
        !gameActive ||
        bonusActive
      ) {

        return;

      }


      cell.num =
        null;


      cell.el.textContent =
        '';


      cell.el
        .classList
        .remove(
          'active',
          'correct'
        );


      cell.el
        .classList
        .add(
          'empty'
        );


      /*
        다음 숫자
      */

      nextExp++;


      /*
        남은 버튼 확인
      */

      const remaining =
        cells.filter(
          c =>
            c.num !== null
        ).length;


      /*
        9개 전부 제거

        → 다음 판
      */

      if (
        remaining === 0
      ) {

        refillGrid();

      }

      else {

        updateActiveCard();

      }

    },
    100
  );

}


/* ══════════════════════════════
   전체 게임 타이머
══════════════════════════════ */

function startTimer() {

  timeLeft =
    60;


  sound30Played =
    false;


  sound10Played =
    false;


  $('timer')
    .textContent =
      timeLeft;


  $('timer')
    .classList
    .remove(
      'urgent'
    );


  timerInt =
    setInterval(
      () => {

        timeLeft--;


        $('timer')
          .textContent =
            timeLeft;


        /*
          30초 알림
        */

        if (
          timeLeft ===
          30 &&
          !sound30Played
        ) {

          sound30Played =
            true;


          sound30Seconds();

        }


        /*
          10초 알림
        */

        if (
          timeLeft ===
          10 &&
          !sound10Played
        ) {

          sound10Played =
            true;


          sound10Seconds();

        }


        /*
          10초 이하
          빨간색
        */

        if (
          timeLeft <=
          10
        ) {

          $('timer')
            .classList
            .add(
              'urgent'
            );

        }


        /*
          게임 종료
        */

        if (
          timeLeft <=
          0
        ) {

          endGame();

        }

      },
      1000
    );

}


/* ══════════════════════════════
   타이머 정지
══════════════════════════════ */

function stopTimer() {

  if (
    timerInt !==
    null
  ) {

    clearInterval(
      timerInt
    );


    timerInt =
      null;

  }

}


/* ══════════════════════════════
   게임 리셋
══════════════════════════════ */

function resetGame() {

  stopTimer();

  stopBonusTimer();


  gameActive =
    false;


  countdownRunning =
    false;


  bonusActive =
    false;


  nextExp =
    1;


  score =
    0;


  round =
    1;


  timeLeft =
    60;


  bonusReturnNumbers =
    null;


  $('timer')
    .textContent =
      '60';


  $('timer')
    .classList
    .remove(
      'urgent'
    );


  $('score-disp')
    .textContent =
      '0';


  $('next-num')
    .textContent =
      '1';


  $('countdown')
    .textContent =
      '';


  $('bonus-status')
    .classList
    .remove(
      'show'
    );


  $('next-hint')
    .style.visibility =
      'visible';


  buildGrid();

}


/* ══════════════════════════════
   게임 시작
══════════════════════════════ */

async function startGame() {

  if (
    countdownRunning
  ) {

    return;

  }


  countdownRunning =
    true;


  gameActive =
    false;


  nextExp =
    1;


  score =
    0;


  round =
    1;


  $('score-disp')
    .textContent =
      '0';


  buildGrid();


  const cd =
    $('countdown');


  /*
    카운트다운
  */

  for (
    const text of
    ['3','2','1','시작!']
  ) {

    cd.textContent =
      text;


    await delay(

      text ===
      '시작!'

        ? 700

        : 820

    );

  }


  cd.textContent =
    '';


  /*
    시작 효과음
  */

  soundGameStart();


  gameActive =
    true;


  countdownRunning =
    false;


  startTimer();

}


/* ══════════════════════════════
   게임 종료
══════════════════════════════ */

async function endGame() {

  /*
    중복 종료 방지
  */

  if (
    !gameActive
  ) {

    return;

  }


  stopTimer();

  stopBonusTimer();


  gameActive =
    false;


  bonusActive =
    false;


  countdownRunning =
    false;


  /*
    종료 효과음
  */

  soundGameEnd();


  const finalScore =
    score;


  /*
    보너스 UI 제거
  */

  $('bonus-status')
    .classList
    .remove(
      'show'
    );


  $('next-hint')
    .style.visibility =
      'visible';


  /*
    결과 화면
  */

  $('r-name')
    .textContent =
      nickname;


  $('r-score')
    .textContent =
      finalScore;


  $('r-rank')
    .textContent =
      '';


  $('lb-rows')
    .innerHTML =
      '';


  $('lb-loading')
    .style.display =
      'block';


  $('lb-loading')
    .textContent =
      '기록 저장 중...';


  showResult();


  try {

    await window.fbSave(
      nickname,
      finalScore
    );


    $('lb-loading')
      .textContent =
      '랭킹 불러오는 중...';


    const top10 =
      await window.fbLoadTop10();


    $('lb-loading')
      .style.display =
      'none';


    renderRanking(
      top10,
      nickname,
      finalScore
    );

  }

  catch(e) {

    console.error(e);


    $('lb-loading')
      .textContent =
        '네트워크 오류 — 랭킹을 불러올 수 없습니다';

  }

}


/* ══════════════════════════════
   랭킹
══════════════════════════════ */

function renderRanking(
  rows,
  myName,
  myScore
) {

  if (
    !rows ||
    rows.length === 0
  ) {

    $('lb-rows')
      .innerHTML =

        '<div style="text-align:center;padding:1rem;color:var(--text2);font-size:14px;">아직 기록이 없습니다</div>';

    return;

  }


  const medals = [

    '🥇',
    '🥈',
    '🥉'

  ];


  const rankClasses = [

    'gold',
    'silver',
    'bronze'

  ];


  let myRank =
    -1;


  const html =
    rows
      .map(
        (r,i) => {

          const isMe =
            r.name ===
            myName &&
            r.score ===
            myScore;


          if (
            isMe &&
            myRank < 0
          ) {

            myRank =
              i + 1;

          }


          const rankLabel =
            i < 3

              ? medals[i]

              : i + 1;


          const rankCls =
            i < 3

              ? rankClasses[i]

              : '';


          return `

            <div
              class="lb-row${isMe ? ' me' : ''}">

              <span
                class="lb-rank ${rankCls}">

                ${rankLabel}

              </span>


              <span
                class="lb-name">

                ${r.name}

              </span>


              <span
                class="lb-score">

                ${r.score}점

              </span>

            </div>

          `;

        }
      )
      .join('');


  $('lb-rows')
    .innerHTML =
      html;


  if (
    myRank > 0
  ) {

    $('r-rank')
      .innerHTML =

        `<strong>${myRank}위</strong> / ${rows.length}명`;

  }

  else {

    $('r-rank')
      .innerHTML =
        '10위권 밖';

  }

}
