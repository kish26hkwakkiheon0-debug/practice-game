window.fbSave =
  async (name, score) => {

    await push(
      ref(db, 'scores'),

        name,
        score,
        t: Date.now()
      }
    );

  };


/* ======================================
   TOP 10 불러오기
======================================= */

window.fbLoadTop10 =
  async () => {

    const snap =
      await get(
        ref(db, 'scores')
      );


    if (!snap.exists()) {
      return [];
    }


    const rows =
      Object.values(
        snap.val()
      );


    const best = {};


    rows.forEach(r => {

      if (
        !best[r.name] ||
        r.score >
        best[r.name].score
      ) {

        best[r.name] = r;

      }

    });


    return Object.values(best)

      .sort(
        (a, b) =>
          b.score - a.score
      )

      .slice(0, 10);

  };

    'keydown',
    e => {

      if (e.key === 'Enter') {

        $('nick-ok').click();

      }

    }
  );


/* ======================================
   그리드 생성
======================================= */

function buildGrid() {

  const grid =
    $('grid');


  grid.innerHTML = '';


  grid.classList.remove(
    'locked'
  );


  cells = [];


  isLocked = false;


  itemActive = false;


  const nums =
    shuffle([
      1,2,3,
      4,5,6,
      7,8,9
    ]);


  nums.forEach(
    (n, idx) => {

      const d =
        document.createElement(
          'div'
        );


      d.className =
        'card';


      d.textContent =
        n;


      const handleTap =
        e => {

          e.preventDefault();

          onCard(idx);

        };


      d.addEventListener(
        'pointerdown',
        handleTap
      );


      grid.appendChild(d);


      cells.push({

        el: d,

        num: n,

        item: false

      });

    }
  );


  updateActiveCard();

}


/* ======================================
   셔플
======================================= */

function shuffle(a) {

  const arr =
    [...a];


  for (
    let i = arr.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }


  return arr;

}


/* ======================================
   활성 카드 표시
======================================= */

function updateActiveCard() {

  cells.forEach(c => {

    c.el.classList.remove(
      'active',
      'done',
      'item'
    );


    /*
      아이템 카드

      실제 num은 nextExp이지만
      화면에서는 ⏱️로 표시
    */

    if (c.item) {

      c.el.classList.add(
        'active',
        'item'
      );

      return;

    }


    /*
      이미 지나간 숫자
    */

    if (
      c.num < nextExp
    ) {

      c.el.classList.add(
        'done'
      );

    }


    /*
      다음에 눌러야 하는 숫자
    */

    if (
      c.num === nextExp
    ) {

      c.el.classList.add(
        'active'
      );

    }

  });


  $('next-num').textContent =
    nextExp;

}


/* ======================================
   카드 탭
======================================= */

function onCard(idx) {

  if (
    !gameActive ||
    isLocked
  ) {

    return;

  }


  const cell =
    cells[idx];


  /* ====================================
     아이템 카드
  ==================================== */

  if (cell.item) {

    /*
      아이템이 가리고 있는
      실제 숫자가 nextExp인지 확인
    */

    if (
      cell.num !== nextExp
    ) {

      return;

    }


    /*
      아이템도
      숫자를 맞힌 것으로 처리
    */

    score++;


    $('score-disp').textContent =
      score;


    /*
      시간 +3초
    */

    timeLeft +=
      ITEM_TIME_BONUS;


    $('timer').textContent =
      timeLeft;


    /*
      아이템 제거
    */

    cell.item = false;


    /*
      기존 숫자 시스템과 동일하게
      nextExp + 9로 변경
    */

    const newNum =
      nextExp + 9;


    cell.num =
      newNum;


    cell.el.textContent =
      newNum;


    /*
      다음 숫자로 진행
    */

    nextExp++;


    /*
      나머지 숫자 랜덤 재배열
    */

    const activeIndices =
      cells

        .map(
          (c, i) => ({
            c,
            i
          })
        )

        .filter(
          ({ c }) =>
            !c.item &&
            c.num >= nextExp
        );


    const shuffledNums =
      shuffle(
        activeIndices.map(
          ({ c }) => c.num
        )
      );


    activeIndices.forEach(
      ({ i }, j) => {

        cells[i].num =
          shuffledNums[j];

        cells[i].el.textContent =
          shuffledNums[j];

      }
    );


    itemActive = false;


    updateActiveCard();


    return;

  }


  /* ====================================
     일반 숫자
  ==================================== */

  if (
    cell.num !== nextExp
  ) {

    /*
      틀림

      1초간 그리드 잠금
    */

    isLocked = true;


    const grid =
      $('grid');


    grid.classList.add(
      'locked'
    );


    cell.el.classList.add(
      'wrong'
    );


    setTimeout(
      () => {

        cell.el.classList.remove(
          'wrong'
        );


        grid.classList.remove(
          'locked'
        );


        isLocked = false;

      },
      1000
    );


    return;

  }


  /* ====================================
     숫자 정답
  ==================================== */

  score++;


  $('score-disp').textContent =
    score;


  /*
    누른 숫자를
    +9 숫자로 변경
  */

  const newNum =
    nextExp + 9;


  cell.num =
    newNum;


  cell.el.textContent =
    newNum;


  /*
    다음 숫자로
  */

  nextExp++;


  /* ====================================
     숫자 랜덤 재배열
  ==================================== */

  const activeIndices =
    cells

      .map(
        (c, i) => ({
          c,
          i
        })
      )

      .filter(
        ({ c }) =>
          !c.item &&
          c.num >= nextExp
      );


  const shuffledNums =
    shuffle(
      activeIndices.map(
        ({ c }) => c.num
      )
    );


  activeIndices.forEach(
    ({ i }, j) => {

      cells[i].num =
        shuffledNums[j];

      cells[i].el.textContent =
        shuffledNums[j];

    }
  );


  /* ====================================
     20% 확률로 아이템 생성
  ==================================== */

  if (
    !itemActive &&
    Math.random() < ITEM_CHANCE
  ) {

    /*
      핵심:

      "다음 숫자" 자체를
      아이템 카드로 바꾼다.

      예:

      nextExp = 14

      기존:
      [ 14 ]

      아이템:
      [ ⏱️ ]

      하지만 내부적으로는
      여전히 num = 14
    */

    const targetCell =
      cells.find(
        c =>
          !c.item &&
          c.num === nextExp
      );


    if (targetCell) {

      targetCell.item = true;


      targetCell.el.textContent =
        '⏱️';


      itemActive = true;

    }

  }


  updateActiveCard();

}


/* ======================================
   타이머
======================================= */

function startTimer() {

  timeLeft = 15;


  $('timer').textContent =
    timeLeft;


  $('timer').classList.remove(
    'urgent'
  );


  timerInt =
    setInterval(
      () => {

        timeLeft--;


        $('timer').textContent =
          timeLeft;


        if (
          timeLeft <= 5
        ) {

          $('timer')
            .classList.add(
              'urgent'
            );

        }


        if (
          timeLeft <= 0
        ) {

          endGame();

        }

      },
      1000
    );

}


function stopTimer() {

  clearInterval(
    timerInt
  );

  timerInt = null;

}


/* ======================================
   게임 리셋
======================================= */

function resetGame() {

  stopTimer();


  nextExp = 1;

  score = 0;

  gameActive = false;

  isLocked = false;

  itemActive = false;

  timeLeft = 15;


  $('timer').textContent =
    '15';


  $('timer').classList.remove(
    'urgent'
  );


  $('score-disp').textContent =
    '0';


  $('next-num').textContent =
    '1';


  $('countdown').textContent =
    '';


  $('start-btn').style.display =
    'block';


  $('start-btn').disabled =
    false;


  $('nick-badge').textContent =
    nickname;


  buildGrid();

}


/* ======================================
   게임 시작
======================================= */

async function startGame() {

  $('start-btn').disabled =
    true;


  $('start-btn').style.display =
    'none';


  nextExp = 1;

  score = 0;

  isLocked = false;

  itemActive = false;


  $('score-disp').textContent =
    '0';


  buildGrid();


  const cd =
    $('countdown');


  for (
    const s of [
      '3',
      '2',
      '1',
      '시작!'
    ]
  ) {

    cd.textContent =
      s;


    await delay(
      s === '시작!'
        ? 700
        : 820
    );

  }


  cd.textContent =
    '';


  gameActive = true;


  startTimer();

}


/* ======================================
   게임 종료
======================================= */

async function endGame() {

  /*
    타이머가 이미 끝났다면
    중복 실행 방지
  */

  if (!gameActive) {

    return;

  }


  stopTimer();


  gameActive = false;


  isLocked = false;


  const finalScore =
    score;


  $('r-name').textContent =
    nickname;


  $('r-score').textContent =
    finalScore;


  $('r-rank').textContent =
    '';


  $('lb-rows').innerHTML =
    '';


  $('lb-loading').style.display =
    'block';


  $('lb-loading').textContent =
    '기록 저장 중...';


  showResult();


  try {

    await window.fbSave(
      nickname,
      finalScore
    );


    $('lb-loading').textContent =
      '랭킹 불러오는 중...';


    const top10 =
      await window.fbLoadTop10();


    $('lb-loading').style.display =
      'none';


    renderResultRanking(
      top10,
      nickname,
      finalScore
    );

  }

  catch(e) {

    console.error(e);


    $('lb-loading').textContent =
      '네트워크 오류 — 랭킹을 불러올 수 없습니다';

  }

}


/* ======================================
   랭킹 렌더링
======================================= */

function renderRows(
  containerEl,
  rows,
  myName = null,
  myScore = null
) {

  if (
    !rows ||
    rows.length === 0
  ) {

    containerEl.innerHTML =
      `
      <div
        style="
          text-align:center;
          padding:1.5rem;
          color:var(--text2);
          font-size:14px;
        "
      >
        아직 기록이 없습니다
      </div>
      `;


    return -1;

  }


  const medals = [
    '🥇',
    '🥈',
    '🥉'
  ];


  const rankClasses = [
    'gold',
    'silver',
    'bronze'
  ];


  let myRank = -1;


  const html =
    rows

      .map(
        (r, i) => {

          const isMe =
            (
              myName &&
              myScore !== null
            ) &&
            (
              r.name === myName &&
              r.score === myScore
            );


          if (
            isMe &&
            myRank < 0
          ) {

            myRank =
              i + 1;

          }


          const rankLabel =
            i < 3
              ? medals[i]
              : i + 1;


          const rankCls =
            i < 3
              ? rankClasses[i]
              : '';


          return `
            <div
              class="lb-row${isMe ? ' me' : ''}"
            >

              <span
                class="lb-rank ${rankCls}"
              >
                ${rankLabel}
              </span>

              <span class="lb-name">
                ${r.name}
              </span>

              <span class="lb-score">
                ${r.score}개
              </span>

            </div>
          `;

        }
      )
      .join('');


  containerEl.innerHTML =
    html;


  return myRank;

}


/* ======================================
   결과창 랭킹
======================================= */

function renderResultRanking(
  rows,
  myName,
  myScore
) {

  const myRank =
    renderRows(
      $('lb-rows'),
      rows,
      myName,
      myScore
    );


  if (
    myRank > 0
  ) {

    $('r-rank').innerHTML =
      `
      <strong>
        ${myRank}위
      </strong>
      /
      ${rows.length}명
      `;

  }

  else {

    $('r-rank').innerHTML =
      '10위권 밖';

  }

}


/* ======================================
   결과창 버튼
======================================= */

$('start-btn')
  .addEventListener(
    'click',
    startGame
  );


$('btn-again')
  .addEventListener(
    'click',
    () => {

      $('screen-result')
        .classList.remove(
          'show'
        );


      showGame();

      resetGame();

    }
  );


$('btn-new')
  .addEventListener(
    'click',
    () => {

      $('screen-result')
        .classList.remove(
          'show'
        );


      showNick();

    }
  );


$('btn-home')
  .addEventListener(
    'click',
    () => {

      showTitle();

    }
  );
