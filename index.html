<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#ffffff">

<title>숫자 탭 게임</title>


<style>

/* ══════════════════════════════
   기본
══════════════════════════════ */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;

  -webkit-tap-highlight-color: transparent;
}


:root {

  --bg: #ffffff;
  --bg2: #f5f5f3;
  --bg3: #e8e8e5;

  --text: #1a1a1a;
  --text2: #666660;

  --border: rgba(0,0,0,0.13);
  --border2: rgba(0,0,0,0.22);

  --info: #185fa5;
  --danger: #e24b4a;

  /* 정답 */
  --correct-bg: #d9f5d0;
  --correct-border: #3b8f32;
  --correct-text: #24651f;

  /* 오답 */
  --wrong-bg: #ffe0df;
  --wrong-border: #e24b4a;
  --wrong-text: #b42323;

  --radius: 12px;
  --radius-sm: 8px;
}


@media (prefers-color-scheme: dark) {

  :root {

    --bg: #1c1c1e;
    --bg2: #2c2c2e;
    --bg3: #3a3a3c;

    --text: #f2f2f7;
    --text2: #8e8e93;

    --border: rgba(255,255,255,0.1);
    --border2: rgba(255,255,255,0.2);

    --info: #64a8f0;
    --danger: #ff6b6b;

    --correct-bg: #1f4d24;
    --correct-border: #65b85c;
    --correct-text: #a9e5a2;

    --wrong-bg: #5a2020;
    --wrong-border: #ff6b6b;
    --wrong-text: #ffb0b0;
  }
}


body {

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    sans-serif;

  background: var(--bg);
  color: var(--text);

  min-height: 100vh;

  overscroll-behavior: none;
}


#app {

  max-width: 420px;

  margin: 0 auto;

  padding:
    1.5rem
    1rem
    3rem;
}


/* ══════════════════════════════
   버튼
══════════════════════════════ */

.btn-primary {

  display: block;

  width: 100%;

  padding: 14px;

  font-size: 16px;

  font-weight: 600;

  border-radius: var(--radius-sm);

  border: none;

  background: var(--text);

  color: var(--bg);

  cursor: pointer;

  touch-action: manipulation;
}


.btn-primary:active {

  opacity: 0.75;

  transform: scale(0.98);
}


.btn-secondary {

  display: block;

  width: 100%;

  padding: 13px;

  font-size: 15px;

  font-weight: 500;

  border-radius: var(--radius-sm);

  border:
    0.5px solid var(--border2);

  background: var(--bg);

  color: var(--text);

  cursor: pointer;

  touch-action: manipulation;
}


.btn-secondary:active {

  background: var(--bg3);
}


/* ══════════════════════════════
   닉네임 화면
══════════════════════════════ */

#screen-nick {

  display: flex;

  flex-direction: column;

  align-items: center;

  padding-top: 3.5rem;
}


.game-title {

  font-size: 28px;

  font-weight: 700;

  margin-bottom: 6px;

  text-align: center;
}


.game-sub {

  font-size: 14px;

  color: var(--text2);

  margin-bottom: 2.5rem;

  text-align: center;

  line-height: 1.6;
}


#nick-input {

  width: 100%;

  max-width: 300px;

  font-size: 17px;

  padding: 12px 14px;

  margin-bottom: 14px;

  border-radius: var(--radius-sm);

  border:
    0.5px solid var(--border2);

  background: var(--bg);

  color: var(--text);

  outline: none;

  -webkit-appearance: none;
}


#nick-input:focus {

  border-color: var(--info);

  box-shadow:
    0 0 0 3px
    rgba(24,95,165,0.12);
}


#nick-ok {

  max-width: 300px;
}


/* ══════════════════════════════
   게임 화면
══════════════════════════════ */

#screen-game {

  display: none;
}


#header {

  display: flex;

  align-items: center;

  gap: 10px;

  margin-bottom: 1rem;
}


#nick-badge {

  flex: 1;

  font-size: 14px;

  color: var(--text2);

  font-weight: 500;

  white-space: nowrap;

  overflow: hidden;

  text-overflow: ellipsis;
}


#timer-wrap {

  display: flex;

  flex-direction: column;

  align-items: flex-end;

  flex-shrink: 0;
}


#timer {

  font-size: 32px;

  font-weight: 700;

  font-variant-numeric: tabular-nums;

  line-height: 1;

  color: var(--text);
}


#timer.urgent {

  color: var(--danger);
}


#timer-label {

  font-size: 11px;

  color: var(--text2);

  margin-top: 1px;
}


/* ══════════════════════════════
   점수
══════════════════════════════ */

#score-wrap {

  display: flex;

  align-items: center;

  justify-content: space-between;

  background: var(--bg2);

  border-radius: var(--radius-sm);

  padding: 10px 16px;

  margin-bottom: 1rem;
}


#score-wrap .s-label {

  font-size: 13px;

  color: var(--text2);
}


#score-wrap .s-val {

  font-size: 22px;

  font-weight: 700;

  font-variant-numeric: tabular-nums;
}


#next-hint {

  font-size: 13px;

  color: var(--text2);
}


#next-hint span {

  color: var(--info);

  font-weight: 700;

  font-size: 16px;
}


/* ══════════════════════════════
   카운트다운
══════════════════════════════ */

#countdown {

  height: 72px;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 58px;

  font-weight: 700;
}


/* ══════════════════════════════
   그리드
══════════════════════════════ */

#grid {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

  margin-bottom: 10px;
}


/* ══════════════════════════════
   숫자 버튼
══════════════════════════════ */

.card {

  aspect-ratio: 1;

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 28px;

  font-weight: 700;

  border-radius: var(--radius);

  border:
    0.5px solid var(--border2);

  background: var(--bg);

  color: var(--text);

  user-select: none;

  -webkit-user-select: none;

  touch-action: manipulation;

  cursor: pointer;

  transition:
    transform 0.08s,
    background 0.1s,
    border-color 0.1s,
    color 0.1s;
}


/* 현재 눌러야 하는 숫자 */

.card.active {

  cursor: pointer;
}


.card.active:active {

  transform: scale(0.91);
}


/* ══════════════════════════════
   정답 효과
══════════════════════════════ */

.card.correct {

  background: var(--correct-bg);

  border-color: var(--correct-border);

  color: var(--correct-text);

  transform: scale(0.93);
}


/* ══════════════════════════════
   오답 효과
══════════════════════════════ */

.card.wrong {

  background: var(--wrong-bg);

  border-color: var(--wrong-border);

  color: var(--wrong-text);

  animation:
    shake 0.35s;
}


@keyframes shake {

  0%, 100% {
    transform: translateX(0);
  }

  20% {
    transform: translateX(-8px);
  }

  40% {
    transform: translateX(8px);
  }

  60% {
    transform: translateX(-5px);
  }

  80% {
    transform: translateX(5px);
  }
}


/* ══════════════════════════════
   사라진 버튼
══════════════════════════════ */

.card.empty {

  visibility: hidden;

  pointer-events: none;
}


/* ══════════════════════════════
   결과 화면
══════════════════════════════ */

#screen-result {

  display: none;

  position: fixed;

  inset: 0;

  background:
    rgba(0,0,0,0.6);

  z-index: 200;

  align-items: flex-end;

  justify-content: center;
}


#screen-result.show {

  display: flex;
}


#result-sheet {

  background: var(--bg);

  width: 100%;

  max-width: 480px;

  border-radius:
    20px
    20px
    0
    0;

  padding:
    1.5rem
    1.25rem
    2.5rem;

  max-height: 92vh;

  overflow-y: auto;

  -webkit-overflow-scrolling: touch;

  animation:
    slideUp 0.25s ease;
}


@keyframes slideUp {

  from {

    transform:
      translateY(60px);

    opacity: 0;
  }

  to {

    transform:
      translateY(0);

    opacity: 1;
  }
}


.result-my {

  text-align: center;

  padding-bottom: 1.25rem;

  border-bottom:
    0.5px solid var(--border);

  margin-bottom: 1.25rem;
}


.result-my .r-lbl {

  font-size: 12px;

  color: var(--text2);

  margin-bottom: 4px;
}


.result-my .r-name {

  font-size: 16px;

  font-weight: 600;

  margin-bottom: 6px;
}


.result-my .r-score {

  font-size: 52px;

  font-weight: 700;

  line-height: 1;

  margin-bottom: 4px;
}


.result-my .r-score-label {

  font-size: 13px;

  color: var(--text2);

  margin-bottom: 8px;
}


.result-my .r-rank {

  font-size: 14px;

  color: var(--text2);
}


.result-my .r-rank strong {

  color: var(--info);

  font-size: 20px;
}


.lb-header {

  font-size: 13px;

  font-weight: 600;

  color: var(--text2);

  text-align: center;

  margin-bottom: 0.75rem;
}


.lb-row {

  display: flex;

  align-items: center;

  gap: 10px;

  padding: 8px 4px;

  border-bottom:
    0.5px solid var(--border);

  font-size: 15px;
}


.lb-row:last-child {

  border-bottom: none;
}


.lb-rank {

  width: 28px;

  text-align: center;

  font-weight: 700;

  color: var(--text2);

  flex-shrink: 0;

  font-size: 14px;
}


.lb-rank.gold,
.lb-rank.silver,
.lb-rank.bronze {

  font-size: 20px;
}


.lb-name {

  flex: 1;

  color: var(--text);

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}


.lb-score {

  font-weight: 700;

  color: var(--text);

  min-width: 48px;

  text-align: right;
}


.lb-row.me {

  background:
    rgba(24,95,165,0.07);

  border-radius: 8px;

  margin:
    2px -4px;

  padding:
    8px;
}


.lb-row.me .lb-name,
.lb-row.me .lb-score {

  color: var(--info);
}


.lb-row.me .lb-rank {

  color: var(--info);
}


#lb-loading {

  text-align: center;

  padding: 1.5rem 0;

  font-size: 14px;

  color: var(--text2);
}


.result-actions {

  display: flex;

  flex-direction: column;

  gap: 10px;

  margin-top: 1.5rem;
}


#credit {

  position: fixed;

  bottom: 14px;

  right: 16px;

  font-size: 11px;

  color: var(--text2);

  opacity: 0.6;

  pointer-events: none;

  z-index: 10;
}

</style>
</head>

<script type="module">

import {
  initializeApp
}
from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  get
}
from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



const firebaseConfig = {

  apiKey:
    "AIzaSyDVrf8vbtBHJYD93EhXosITNmgym80GOMw",

  authDomain:
    "numberupgame.firebaseapp.com",

  databaseURL:
    "https://numberupgame-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "numberupgame",

  storageBucket:
    "numberupgame.firebasestorage.app",

  messagingSenderId:
    "209419310847",

  appId:
    "1:209419310847:web:916c8f6fc0a730b8191eca"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);



window.fbSave =
  async (name, score) => {

    await push(
      ref(db, 'scores'),
      {
        name: name,
        score: score,
        t: Date.now()
      }
    );

  };



window.fbLoadTop10 =
  async () => {

    const snap =
      await get(
        ref(db, 'scores')
      );


    if (!snap.exists()) {

      return [];

    }


    const rows =
      Object.values(
        snap.val()
      );


    const best = {};


    rows.forEach(r => {

      if (
        !best[r.name] ||
        r.score > best[r.name].score
      ) {

        best[r.name] = r;

      }

    });


    return Object.values(best)

      .sort(
        (a, b) =>
          b.score - a.score
      )

      .slice(0, 10);

  };

</script>



<script>

/* ══════════════════════════════
   기본 변수
══════════════════════════════ */

const $ =
  id =>
    document.getElementById(id);


let nickname = '';


let cells = [];


/*
  현재 눌러야 하는 숫자
*/

let nextExp = 1;


/*
  현재 총점
*/

let score = 0;


/*
  현재 라운드

  1라운드 → 1점
  2라운드 → 2점
  3라운드 → 3점
  ...
*/

let round = 1;


/*
  남은 시간
*/

let timeLeft = 15;


let timerInt = null;


/*
  게임 진행 여부
*/

let gameActive = false;


/*
  카운트다운 진행 중인지
*/

let countdownRunning = false;


/* ══════════════════════════════
   유틸
══════════════════════════════ */

function delay(ms) {

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}


/* ══════════════════════════════
   화면 전환
══════════════════════════════ */

function showNick() {

  stopTimer();


  gameActive = false;

  countdownRunning = false;


  $('screen-nick').style.display =
    'flex';


  $('screen-game').style.display =
    'none';


  $('screen-result')
    .classList.remove('show');


  $('nick-input').value = '';


  setTimeout(
    () =>
      $('nick-input').focus(),
    100
  );

}


function showGame() {

  $('screen-nick').style.display =
    'none';


  $('screen-game').style.display =
    'block';


  $('screen-result')
    .classList.remove('show');

}


function showResult() {

  $('screen-result')
    .classList.add('show');

}


/* ══════════════════════════════
   닉네임 입력
══════════════════════════════ */

function enterNickname() {

  const v =
    $('nick-input')
      .value
      .trim();


  if (!v) {

    $('nick-input').focus();

    return;

  }


  nickname = v;


  $('nick-badge')
    .textContent =
      nickname;


  /*
    게임 화면으로 이동
  */

  showGame();


  /*
    바로 게임 준비

    버튼을 누를 필요 없이
    자동으로 startGame 실행
  */

  resetGame();


  startGame();

}


$('nick-ok')
  .addEventListener(
    'click',
    enterNickname
  );


$('nick-input')
  .addEventListener(
    'keydown',
    e => {

      if (e.key === 'Enter') {

        enterNickname();

      }

    }
  );


/* ══════════════════════════════
   숫자 배열
══════════════════════════════ */

function makeNumbers(start) {

  const numbers = [];


  for (
    let i = 0;
    i < 9;
    i++
  ) {

    numbers.push(
      start + i
    );

  }


  return shuffle(numbers);

}


/* ══════════════════════════════
   그리드 생성
══════════════════════════════ */

function buildGrid() {

  const grid =
    $('grid');


  grid.innerHTML = '';


  cells = [];


  /*
    현재 숫자부터
    9개 생성
  */

  const nums =
    makeNumbers(nextExp);


  nums.forEach(
    (n, idx) => {

      const d =
        document.createElement('div');


      d.className =
        'card';


      d.textContent =
        n;


      /*
        중요:

        touchend + click을
        동시에 사용하지 않는다.

        pointerup 하나만 사용해서
        모바일에서 한 번 터치한 것이
        두 번 처리되는 문제를 방지한다.
      */

      d.addEventListener(
        'pointerup',
        e => {

          e.preventDefault();

          onCard(idx);

        }
      );


      grid.appendChild(d);


      cells.push({

        el: d,

        num: n

      });

    }
  );


  updateActiveCard();

}


/* ══════════════════════════════
   배열 섞기
══════════════════════════════ */

function shuffle(array) {

  const arr =
    [...array];


  for (
    let i = arr.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );


    [
      arr[i],
      arr[j]
    ] =
    [
      arr[j],
      arr[i]
    ];

  }


  return arr;

}


/* ══════════════════════════════
   활성 카드 표시
══════════════════════════════ */

function updateActiveCard() {

  cells.forEach(cell => {

    cell.el.classList.remove(
      'active'
    );


    /*
      사라진 버튼
    */

    if (
      cell.num === null
    ) {

      cell.el.classList.add(
        'empty'
      );

      return;

    }


    cell.el.classList.remove(
      'empty'
    );


    /*
      현재 눌러야 하는 숫자
    */

    if (
      cell.num === nextExp
    ) {

      cell.el.classList.add(
        'active'
      );

    }

  });


  $('next-num')
    .textContent =
      nextExp;

}


/* ══════════════════════════════
   다음 라운드
══════════════════════════════ */

function refillGrid() {

  /*
    라운드 증가

    1 → 2
    2 → 3
    3 → 4
    ...
  */

  round++;


  /*
    현재 nextExp부터
    새로운 숫자 9개 생성

    예:

    1~9
    ↓
    10~18
    ↓
    19~27
  */

  const nums =
    makeNumbers(nextExp);


  cells.forEach(
    (cell, index) => {

      cell.num =
        nums[index];


      cell.el.textContent =
        nums[index];


      /*
        이전 효과 제거
      */

      cell.el.classList.remove(
        'correct',
        'wrong',
        'empty'
      );

    }
  );


  updateActiveCard();

}


/* ══════════════════════════════
   카드 입력
══════════════════════════════ */

function onCard(idx) {

  /*
    게임 중이 아니면 무시
  */

  if (!gameActive) {

    return;

  }


  const cell =
    cells[idx];


  /*
    이미 사라진 버튼이면 무시
  */

  if (
    cell.num === null
  ) {

    return;

  }


  /* ══════════════════════
     오답
  ══════════════════════ */

  if (
    cell.num !== nextExp
  ) {

    /*
      기존 애니메이션 제거
    */

    cell.el.classList.remove(
      'wrong'
    );


    /*
      강제로 다시 렌더링해서
      연속 오답도 매번 효과 발생
    */

    void cell.el.offsetWidth;


    /*
      붉은색 + 흔들림
    */

    cell.el.classList.add(
      'wrong'
    );


    setTimeout(
      () => {

        cell.el.classList.remove(
          'wrong'
        );

      },
      350
    );


    return;

  }


  /* ══════════════════════
     정답
  ══════════════════════ */

  /*
    이번 라운드의 점수 추가

    1라운드 → +1
    2라운드 → +2
    3라운드 → +3
  */

  score += round;


  $('score-disp')
    .textContent =
      score;


  /*
    초록색 표시
  */

  cell.el.classList.remove(
    'wrong'
  );


  cell.el.classList.add(
    'correct'
  );


  /*
    버튼을 즉시 제거한다.

    색상 효과가 보이도록
    아주 짧은 시간 후 제거.
  */

  setTimeout(
    () => {

      /*
        이미 게임이 끝났다면
        더 이상 처리하지 않음
      */

      if (!gameActive) {

        return;

      }


      /*
        버튼 제거
      */

      cell.num = null;

      cell.el.textContent = '';


      cell.el.classList.remove(
        'active',
        'correct'
      );


      cell.el.classList.add(
        'empty'
      );


      /*
        다음 숫자
      */

      nextExp++;


      /*
        남은 버튼 수
      */

      const remaining =
        cells.filter(
          c =>
            c.num !== null
        ).length;


      /*
        9개를 모두 눌렀으면
        새로운 판 생성
      */

      if (
        remaining === 0
      ) {

        refillGrid();

      }

      else {

        /*
          같은 판에서는
          절대로 위치를 섞지 않는다.
        */

        updateActiveCard();

      }

    },
    100
  );

}


/* ══════════════════════════════
   타이머
══════════════════════════════ */

function startTimer() {

  timeLeft = 15;


  $('timer')
    .textContent =
      timeLeft;


  $('timer')
    .classList.remove(
      'urgent'
    );


  timerInt =
    setInterval(
      () => {

        timeLeft--;


        $('timer')
          .textContent =
            timeLeft;


        if (
          timeLeft <= 5
        ) {

          $('timer')
            .classList.add(
              'urgent'
            );

        }


        if (
          timeLeft <= 0
        ) {

          endGame();

        }

      },
      1000
    );

}


function stopTimer() {

  if (
    timerInt !== null
  ) {

    clearInterval(
      timerInt
    );

    timerInt = null;

  }

}


/* ══════════════════════════════
   리셋
══════════════════════════════ */

function resetGame() {

  stopTimer();


  gameActive = false;

  countdownRunning = false;


  nextExp = 1;

  score = 0;

  round = 1;

  timeLeft = 15;


  $('timer')
    .textContent =
      '15';


  $('timer')
    .classList.remove(
      'urgent'
    );


  $('score-disp')
    .textContent =
      '0';


  $('next-num')
    .textContent =
      '1';


  $('countdown')
    .textContent =
      '';


  buildGrid();

}


/* ══════════════════════════════
   게임 자동 시작
══════════════════════════════ */

async function startGame() {

  /*
    중복 실행 방지
  */

  if (
    countdownRunning
  ) {

    return;

  }


  countdownRunning = true;

  gameActive = false;


  /*
    게임판 초기화
  */

  nextExp = 1;

  score = 0;

  round = 1;


  $('score-disp')
    .textContent =
      '0';


  buildGrid();


  /*
    카운트다운

    3
    2
    1
    시작!
  */

  const cd =
    $('countdown');


  const sequence =
    ['3', '2', '1', '시작!'];


  for (
    const text of sequence
  ) {

    cd.textContent =
      text;


    await delay(
      text === '시작!'
        ? 700
        : 820
    );

  }


  cd.textContent =
    '';


  /*
    실제 게임 시작
  */

  gameActive = true;

  countdownRunning = false;


  startTimer();

}


/* ══════════════════════════════
   게임 종료
══════════════════════════════ */

async function endGame() {

  /*
    중복 종료 방지
  */

  if (
    !gameActive
  ) {

    return;

  }


  stopTimer();


  gameActive = false;


  countdownRunning = false;


  const finalScore =
    score;


  /*
    결과 화면
  */

  $('r-name')
    .textContent =
      nickname;


  $('r-score')
    .textContent =
      finalScore;


  $('r-rank')
    .textContent =
      '';


  $('lb-rows')
    .innerHTML =
      '';


  $('lb-loading')
    .style.display =
      'block';


  $('lb-loading')
    .textContent =
      '기록 저장 중...';


  showResult();


  /*
    Firebase 저장
  */

  try {

    await window.fbSave(
      nickname,
      finalScore
    );


    $('lb-loading')
      .textContent =
        '랭킹 불러오는 중...';


    const top10 =
      await window.fbLoadTop10();


    $('lb-loading')
      .style.display =
        'none';


    renderRanking(
      top10,
      nickname,
      finalScore
    );


  }

  catch (e) {

    console.error(e);


    $('lb-loading')
      .textContent =
        '네트워크 오류 — 랭킹을 불러올 수 없습니다';

  }

}


/* ══════════════════════════════
   랭킹
══════════════════════════════ */

function renderRanking(
  rows,
  myName,
  myScore
) {

  if (
    !rows ||
    rows.length === 0
  ) {

    $('lb-rows')
      .innerHTML =
        '<div style="text-align:center;padding:1rem;color:var(--text2);font-size:14px;">아직 기록이 없습니다</div>';

    return;

  }


  const medals =
    [
      '🥇',
      '🥈',
      '🥉'
    ];


  const rankClasses =
    [
      'gold',
      'silver',
      'bronze'
    ];


  let myRank = -1;


  const html =
    rows
      .map(
        (r, i) => {

          const isMe =
            r.name === myName &&
            r.score === myScore;


          if (
            isMe &&
            myRank < 0
          ) {

            myRank =
              i + 1;

          }


          const rankLabel =
            i < 3
              ? medals[i]
              : i + 1;


          const rankCls =
            i < 3
              ? rankClasses[i]
              : '';


          return `

            <div class="lb-row${isMe ? ' me' : ''}">

              <span class="lb-rank ${rankCls}">
                ${rankLabel}
              </span>

              <span class="lb-name">
                ${r.name}
              </span>

              <span class="lb-score">
                ${r.score}점
              </span>

            </div>

          `;

        }
      )
      .join('');


  $('lb-rows')
    .innerHTML =
      html;


  if (
    myRank > 0
  ) {

    $('r-rank')
      .innerHTML =
        `<strong>${myRank}위</strong> / ${rows.length}명`;

  }

  else {

    $('r-rank')
      .innerHTML =
        `10위권 밖`;

  }

}


/* ══════════════════════════════
   다시 도전
══════════════════════════════ */

$('btn-again')
  .addEventListener(
    'click',
    () => {

      $('screen-result')
        .classList.remove(
          'show'
        );


      showGame();


      resetGame();


      /*
        다시 도전도 자동 시작
      */

      startGame();

    }
  );

$('btn-new')
